[workspace]
resolver = "2"
members = [
    "crates/meno-core",
    "crates/meno-store",
    "crates/meno-adapters",
    "crates/meno-cli",
    "crates/meno-mcp",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["Boring Infra Co"]
description = "Local, harness-independent verification state layer"

[workspace.dependencies]
meno-core = { path = "crates/meno-core" }
meno-store = { path = "crates/meno-store" }
meno-adapters = { path = "crates/meno-adapters" }
meno-mcp = { path = "crates/meno-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
ulid = { version = "1", features = ["std"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
regex = "1"
tempfile = "3"
quick-xml = { version = "0.37", features = ["serialize"] }

[workspace.lints.rust]
unused_must_use = "deny"

[profile.release]
lto = true
codegen-units = 1
